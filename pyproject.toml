[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genesis-world"
version = "0.5.1"
description = "An offline, inspectable civilization experiment"
requires-python = ">=3.10"
dependencies = ["fastapi==0.135.4", "uvicorn==0.51.0", "pydantic==2.13.4"]

[project.optional-dependencies]
test = ["pytest==9.1.1", "httpx==0.28.1"]

[project.scripts]
genesis = "genesis.cli:main"

[tool.setuptools.packages.find]
include = ["genesis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
